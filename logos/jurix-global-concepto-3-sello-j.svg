<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <!-- Concepto 3: Sello J — monograma moderno tipo sello notarial con órbita global -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&amp;display=swap');
  </style>
  <rect width="520" height="200" fill="#FFFFFF"/>
  <!-- Sello -->
  <rect x="40" y="40" width="120" height="120" rx="10" fill="#7A1F2B"/>
  <!-- Órbita (lo global), abierta como un sello en relieve -->
  <path d="M136 72 A44 44 0 1 1 72 66" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <!-- J geométrica -->
  <path d="M110 62 V112 A16 16 0 0 1 78 112" fill="none" stroke="#FFFFFF" stroke-width="13"/>
  <rect x="96" y="56" width="28" height="7" fill="#FFFFFF"/>
  <!-- Logotipo -->
  <text x="188" y="108" font-family="'DM Sans', Arial, sans-serif" font-weight="700" font-size="40" letter-spacing="1" fill="#1C1C1E">JURIX GLOBAL</text>
  <text x="190" y="136" font-family="'DM Sans', Arial, sans-serif" font-weight="500" font-size="15" letter-spacing="8" fill="#7A1F2B">ESTUDIO JURÍDICO</text>
</svg>

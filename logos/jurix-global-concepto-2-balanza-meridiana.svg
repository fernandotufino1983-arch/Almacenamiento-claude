<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <!-- Concepto 2: Balanza Meridiana — el ecuador del globo es el brazo de una balanza -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&amp;family=Source+Sans+3:wght@500&amp;display=swap');
  </style>
  <rect width="520" height="200" fill="#12372A"/>
  <!-- Globo -->
  <circle cx="100" cy="96" r="52" fill="none" stroke="#A67C52" stroke-width="4"/>
  <ellipse cx="100" cy="96" rx="22" ry="52" fill="none" stroke="#A67C52" stroke-width="2"/>
  <line x1="100" y1="44" x2="100" y2="164" stroke="#EDEAE4" stroke-width="4"/>
  <!-- Brazo de la balanza (ecuador extendido) -->
  <line x1="28" y1="96" x2="172" y2="96" stroke="#EDEAE4" stroke-width="4"/>
  <!-- Platillos -->
  <path d="M28 96 L18 124 H38 Z" fill="none" stroke="#EDEAE4" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M172 96 L162 124 H182 Z" fill="none" stroke="#EDEAE4" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="78" y1="164" x2="122" y2="164" stroke="#EDEAE4" stroke-width="4"/>
  <!-- Logotipo -->
  <text x="208" y="102" font-family="'Playfair Display', Georgia, serif" font-weight="600" font-size="44" fill="#EDEAE4">Jurix Global</text>
  <text x="210" y="134" font-family="'Source Sans 3', Arial, sans-serif" font-weight="500" font-size="15" letter-spacing="7" fill="#EDEAE4">ESTUDIO JURÍDICO</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <!-- Concepto 1: Columna Global — la J es columna clásica dentro de un globo -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Inter:wght@500&amp;display=swap');
  </style>
  <rect width="520" height="200" fill="#F7F4EE"/>
  <!-- Globo -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="#0B1F3A" stroke-width="5"/>
  <ellipse cx="100" cy="100" rx="26" ry="62" fill="none" stroke="#B8955A" stroke-width="2.5"/>
  <line x1="40" y1="78" x2="160" y2="78" stroke="#B8955A" stroke-width="2.5"/>
  <!-- J como columna: capitel + fuste + gancho -->
  <line x1="92" y1="48" x2="132" y2="48" stroke="#0B1F3A" stroke-width="6"/>
  <path d="M112 48 V116 A24 24 0 0 1 64 116" fill="none" stroke="#0B1F3A" stroke-width="14"/>
  <!-- Logotipo -->
  <text x="190" y="108" font-family="'Cormorant Garamond', Georgia, serif" font-weight="600" font-size="60" letter-spacing="6" fill="#0B1F3A">JURIX</text>
  <line x1="192" y1="124" x2="470" y2="124" stroke="#B8955A" stroke-width="1.5"/>
  <text x="192" y="150" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="16" letter-spacing="7" fill="#0B1F3A">GLOBAL · ABOGADOS</text>
</svg>
